</style></head><body><a class="skip" href="#stage-scroll">Skip to current practice</a><header class="top"><h1 id="h-top" tabindex="-1">Qualify an opportunity with MEDDIC</h1><div class="tools"><button type="button" id="restart">Restart</button></div></header><div id="live" class="sr" role="status" aria-live="polite"></div><div id="interactive" class="app"></div><noscript><p>Use the <a href="fallback.html">complete text alternative</a> or <a href="fallback.pdf">PDF alternative</a>.</p></noscript><script>window.PRACTICE_DATA={"title": "Qualify an opportunity with MEDDIC", "version": "v2-20261126-stage-board", "case": "Fictional regional parts distributor with three depots. Maya, Operations Manager, is exploring a cloud inventory visibility service. All people, amounts, dates and outcomes are invented for teaching.", "ratings": {"Known": "The stated evidence supports this scoped entry. Other parts of the opportunity may remain open.", "Partial": "There is useful evidence, but a material part of this entry remains uncertain or untested.", "Missing": "The evidence does not establish this element yet. This is a gap to investigate, not a negative verdict.", "Contradicted": "New evidence overturns a previous entry. Preserve its history and replace the current claim."}, "elements": {"Metrics": "the measurable benefit the customer could gain", "Economic Buyer": "the person with decision authority over the funds", "Decision Criteria": "the requirements used to judge options", "Decision Process": "the steps and people involved in the buying decision", "Identify Pain": "the customer problem and its consequences", "Champion": "influential internal advocacy that helps a proposal progress"}, "stages": [{"id": "s1", "title": "Beginning: initial discovery", "date": "3 February 2027", "events": [[1, "2027-02-03", "E01", "Maya, Operations", "Eight shipments were late last month. Three customers complained. Stock visibility across depots is poor."], [1, "2027-02-03", "E02", "Maya, Operations", "Maya estimates annual avoidable expediting costs at EUR 120,000. Finance has not checked the estimate."], [1, "2027-02-03", "E03", "Maya, Operations", "A EUR 60,000 technology allocation might support the project. Maya has not confirmed an approved amount or who can release it."], [1, "2027-02-03", "E04", "Maya, Operations", "Maya says she can help move the project forward. Her purchasing authority and influence with approvers are unverified."], [1, "2027-02-03", "E05", "Maya, Operations", "Maya wants a rollout before the September 2027 peak. This is a preference, not an approved buying or implementation schedule."], [1, "2027-02-03", "E06", "Maya, Operations", "An ERP migration runs May to August. Its effect on integration capacity and project priority is unknown."]], "ratings": [{"id": "s1-r1", "element": "Metrics", "key": "Partial", "evidence": "E01 E02", "why": "Eight late shipments are reported. EUR 120,000 is an unverified cost estimate.", "question": "Which cost and incident records can finance validate?", "action": "Seek baseline evidence before claiming economic gain."}, {"id": "s1-r2", "element": "Economic buyer", "key": "Missing", "evidence": "E03 E04", "why": "Control of project funds is not established.", "question": "Who can release funds and what would they need to see?", "action": "Ask for access to the funding decision-maker."}, {"id": "s1-r3", "element": "Decision criteria", "key": "Missing", "evidence": "E01 E06", "why": "Operational symptoms are known. Selection criteria are not yet agreed.", "question": "How will IT and operations judge a suitable solution?", "action": "Discover customer evaluation criteria."}, {"id": "s1-r4", "element": "Decision process", "key": "Missing", "evidence": "E04 E05", "why": "A desired date does not explain the buying path.", "question": "What approvals and tests must happen before a purchase?", "action": "Map the customer decision steps."}, {"id": "s1-r5", "element": "Identify pain", "key": "Partial", "evidence": "E01 E02", "why": "Delivery problems matter. Business impact needs validation.", "question": "Who is affected and what happens if the problem continues?", "action": "Validate consequences with operations and finance."}, {"id": "s1-r6", "element": "Champion", "key": "Missing", "evidence": "E04", "why": "Enthusiasm alone does not establish influence or internal advocacy.", "question": "Could Maya connect us to finance and IT to investigate?", "action": "Look for an agreed, observable advocacy action."}], "decision": {"id": "s1-action", "prompt": "Your next task is to establish whether a credible evaluation is worth developing. What should you do now?", "options": [{"id": "rollout", "text": "Propose a full rollout funded by the €60,000 allocation.", "correct": false, "feedback": "E03 reports a possible allocation, not project approval. E06 leaves ERP capacity unresolved. Establish the evidence and buying route before proposing rollout."}, {"id": "discover", "text": "Arrange focused discovery with Finance and IT through Maya.", "correct": true, "feedback": "The reported delays justify investigation. Finance can test the cost, IT can explain the ERP dependency, and Maya can help reach the relevant people. Unknowns call for discovery, not automatic disqualification."}, {"id": "drop", "text": "Drop the opportunity because the economic buyer is unknown.", "correct": false, "feedback": "Missing approval information is an investigation gap. E01 gives a concrete operational problem and E04 offers a route to other people. A focused follow-up is justified."}]}, "question": {"id": "s1-question", "prompt": "Before using the €120,000 figure in a business case, which question most directly addresses its reliability?", "options": [{"id": "verify", "text": "“Maya, can you connect us to Finance to check the incident records and expediting costs?”", "correct": true, "feedback": "E02 attributes an unverified estimate to Maya. Finance and the underlying records can establish a cost baseline. Other MEDDIC gaps also matter, but this task asks specifically about the figure."}, {"id": "host", "text": "“Which country must host the data?”", "correct": false, "feedback": "This could uncover a decision criterion. It does not validate the €120,000 estimate in E02. Ask Finance about the cost records first for this task."}, {"id": "discount", "text": "“Would a discount let you approve this today?”", "correct": false, "feedback": "Price does not establish the cost baseline or Maya’s funding authority. E02 and E04 leave both unverified."}]}}, {"id": "s2", "title": "Middle: finance and IT checks", "date": "10 February 2027", "events": [[1, "2027-02-03", "E01", "Maya, Operations", "Eight shipments were late last month. Three customers complained. Stock visibility across depots is poor."], [1, "2027-02-03", "E02", "Maya, Operations", "Maya estimates annual avoidable expediting costs at EUR 120,000. Finance has not checked the estimate."], [1, "2027-02-03", "E03", "Maya, Operations", "A EUR 60,000 technology allocation might support the project. Maya has not confirmed an approved amount or who can release it."], [1, "2027-02-03", "E04", "Maya, Operations", "Maya says she can help move the project forward. Her purchasing authority and influence with approvers are unverified."], [1, "2027-02-03", "E05", "Maya, Operations", "Maya wants a rollout before the September 2027 peak. This is a preference, not an approved buying or implementation schedule."], [1, "2027-02-03", "E06", "Maya, Operations", "An ERP migration runs May to August. Its effect on integration capacity and project priority is unknown."], [2, "2027-02-10", "E07", "Niamh, Finance Controller", "Finance checks the records: avoidable annual expediting costs are EUR 48,000, replacing the EUR 120,000 estimate. Recoverable savings remain unproven."], [2, "2027-02-10", "E08", "Elena, CFO", "Elena controls project funding. A EUR 15,000 pilot ceiling is available only after IT approval. The full rollout has no approved budget."], [2, "2027-02-10", "E09", "Ravi, Head of IT", "Production integration capacity starts after August. A full rollout before September is infeasible. An isolated pilot could happen earlier."], [2, "2027-02-10", "E10", "Ravi, Head of IT", "Selection criteria include an ERP API, EU data hosting and exportable audit records. ClearRoute has not yet demonstrated these for this customer."], [2, "2027-02-10", "E11", "Elena and Ravi", "The buying path is sandbox test, IT approval, CFO funding decision, then procurement. Rollout dates and funding depend on a later review."], [2, "2027-02-10", "E12", "Observed seller interaction", "Maya shares a depot dataset and introduces the seller to Elena and Ravi. These are advocacy actions, but her ability to mobilise resources still needs testing."]], "ratings": [{"id": "s2-r1", "element": "Metrics", "key": "Contradicted", "evidence": "E02 E07", "why": "Finance replaces the EUR 120,000 estimate with EUR 48,000. Savings are unproven.", "question": "What part of the validated cost could a pilot realistically affect?", "action": "Correct the baseline and avoid a premature ROI claim."}, {"id": "s2-r2", "element": "Economic buyer", "key": "Known", "evidence": "E08 E11", "why": "Elena controls project funding and has conditional pilot authority.", "question": "What evidence does Elena require for pilot and rollout decisions?", "action": "Confirm her conditions directly."}, {"id": "s2-r3", "element": "Decision criteria", "key": "Partial", "evidence": "E10", "why": "API, hosting and audit-export criteria are explicit but untested.", "question": "What test evidence will Ravi accept for each criterion?", "action": "Agree a limited test and acceptance record."}, {"id": "s2-r4", "element": "Decision process", "key": "Partial", "evidence": "E09 E11", "why": "Approval sequence is known. Dates and rollout funding remain open.", "question": "How would a pilot result feed the later rollout review?", "action": "Confirm milestones and dependencies with the buying group."}, {"id": "s2-r5", "element": "Identify pain", "key": "Known", "evidence": "E07 E09", "why": "Validated avoidable cost remains, alongside a real ERP capacity constraint.", "question": "Would a bounded pilot address the pain without disrupting ERP?", "action": "Test the case for a phased next step."}, {"id": "s2-r6", "element": "Champion", "key": "Partial", "evidence": "E12", "why": "Maya supplies data and introductions. Resource influence is still being tested.", "question": "Can Maya secure staff time for a useful pilot?", "action": "Ask for an agreed internal resource action."}], "decision": {"id": "s2-action", "prompt": "Ravi says a pre-September production rollout is infeasible. Which action respects that constraint and Elena’s funding condition?", "options": [{"id": "stop", "text": "Stop all contact until September.", "correct": false, "feedback": "E09 allows an earlier isolated pilot. There is an evidence-building next step that can respect the ERP dependency."}, {"id": "commit", "text": "Book a pre-September full rollout using the pilot ceiling.", "correct": false, "feedback": "E08 limits the €15,000 ceiling to a pilot after IT approval. E09 rules out the proposed production timing. Neither supports a rollout commitment."}, {"id": "test", "text": "Agree an isolated test against Ravi’s criteria before seeking pilot approval.", "correct": true, "feedback": "E10 supplies criteria and E11 requires a sandbox test before IT approval and the CFO decision. This develops the opportunity within the actual constraints."}]}, "question": {"id": "s2-question", "prompt": "To turn the listed requirements into a useful test, which question should you put to Ravi?", "options": [{"id": "date", "text": "“Can you guarantee September go-live if we sign today?”", "correct": false, "feedback": "E09 says production capacity starts after August and rejects the earlier rollout target. Signing does not remove that constraint or define test evidence."}, {"id": "accept", "text": "“What sandbox evidence will you accept for the ERP API, EU hosting and audit export requirements?”", "correct": true, "feedback": "E10 names the criteria but says they are untested. Asking what evidence Ravi will accept connects requirements to an assessable, bounded test."}, {"id": "average", "text": "“Can we use €84,000 as a compromise cost baseline?”", "correct": false, "feedback": "E07 supersedes the estimate with a checked €48,000 cost. Averaging creates an unsupported figure and does not define the technical test."}]}}, {"id": "s3", "title": "End: bounded pilot decision", "date": "24 February 2027", "events": [[1, "2027-02-03", "E01", "Maya, Operations", "Eight shipments were late last month. Three customers complained. Stock visibility across depots is poor."], [1, "2027-02-03", "E02", "Maya, Operations", "Maya estimates annual avoidable expediting costs at EUR 120,000. Finance has not checked the estimate."], [1, "2027-02-03", "E03", "Maya, Operations", "A EUR 60,000 technology allocation might support the project. Maya has not confirmed an approved amount or who can release it."], [1, "2027-02-03", "E04", "Maya, Operations", "Maya says she can help move the project forward. Her purchasing authority and influence with approvers are unverified."], [1, "2027-02-03", "E05", "Maya, Operations", "Maya wants a rollout before the September 2027 peak. This is a preference, not an approved buying or implementation schedule."], [1, "2027-02-03", "E06", "Maya, Operations", "An ERP migration runs May to August. Its effect on integration capacity and project priority is unknown."], [2, "2027-02-10", "E07", "Niamh, Finance Controller", "Finance checks the records: avoidable annual expediting costs are EUR 48,000, replacing the EUR 120,000 estimate. Recoverable savings remain unproven."], [2, "2027-02-10", "E08", "Elena, CFO", "Elena controls project funding. A EUR 15,000 pilot ceiling is available only after IT approval. The full rollout has no approved budget."], [2, "2027-02-10", "E09", "Ravi, Head of IT", "Production integration capacity starts after August. A full rollout before September is infeasible. An isolated pilot could happen earlier."], [2, "2027-02-10", "E10", "Ravi, Head of IT", "Selection criteria include an ERP API, EU data hosting and exportable audit records. ClearRoute has not yet demonstrated these for this customer."], [2, "2027-02-10", "E11", "Elena and Ravi", "The buying path is sandbox test, IT approval, CFO funding decision, then procurement. Rollout dates and funding depend on a later review."], [2, "2027-02-10", "E12", "Observed seller interaction", "Maya shares a depot dataset and introduces the seller to Elena and Ravi. These are advocacy actions, but her ability to mobilise resources still needs testing."], [3, "2027-02-24", "E13", "Ravi, written test note", "The isolated tests pass using synthetic stock records. IT approves a one-depot pilot. Production ERP integration is still untested."], [3, "2027-02-24", "E14", "Elena, approval email", "Elena authorises EUR 15,000 for a six-week pilot after the IT condition is met. This does not authorise the full rollout or establish a signed customer contract."], [3, "2027-02-24", "E15", "Pilot planning meeting", "The pilot will test reducing late shipments from eight to at most three per month. One month's baseline may vary. No reduction or financial saving has been achieved yet."], [3, "2027-02-24", "E16", "Elena, steering note", "Full rollout review is set for 30 September 2027 after ERP stabilisation. Rollout funding and go-live date remain unapproved."], [3, "2027-02-24", "E17", "Observed customer actions", "Maya secures staff time for the pilot and briefs the steering group. This strengthens evidence of an active internal advocate."], [3, "2027-02-24", "E18", "Meeting decision record", "The customer agrees to a bounded pilot and later rollout review. The broader opportunity stays in evaluation. Pilot execution, contract signature and rollout success are not established."]], "ratings": [{"id": "s3-r1", "element": "Metrics", "key": "Partial", "evidence": "E07 E15", "why": "Cost baseline and pilot target are defined. Actual improvement is not measured.", "question": "How will we validate the baseline and measure the pilot's effect?", "action": "Agree measurement ownership before pilot execution."}, {"id": "s3-r2", "element": "Economic buyer", "key": "Known", "evidence": "E14 E16", "why": "Elena authorises pilot spend but leaves rollout funding open.", "question": "What pilot evidence will inform Elena's September review?", "action": "Record her decision conditions and review date."}, {"id": "s3-r3", "element": "Decision criteria", "key": "Partial", "evidence": "E10 E13", "why": "Isolated tests pass. Production ERP fit still requires validation.", "question": "Which production integration evidence remains necessary?", "action": "Keep the production criterion open in the record."}, {"id": "s3-r4", "element": "Decision process", "key": "Known", "evidence": "E13 E14 E16 E18", "why": "Pilot approvals and later review are evidenced. This is not rollout approval.", "question": "Who will sign the pilot terms and own the September decision pack?", "action": "Confirm pilot charter, responsibilities and later review."}, {"id": "s3-r5", "element": "Identify pain", "key": "Known", "evidence": "E01 E07 E15", "why": "The operational and cost problem remains until results show improvement.", "question": "What would make the customer stop or expand after the pilot?", "action": "Agree explicit stop, adapt and expand review criteria."}, {"id": "s3-r6", "element": "Champion", "key": "Known", "evidence": "E12 E17", "why": "Maya supplies access, staff time and internal advocacy. This supports a champion assessment.", "question": "Can Maya sustain engagement through the pilot review?", "action": "Agree her ongoing role without assuming she guarantees a purchase."}], "decision": {"id": "s3-action", "prompt": "What opportunity status is supported by the 24 February record?", "options": [{"id": "bounded", "text": "Pilot authorised; broader rollout remains in evaluation.", "correct": true, "feedback": "E13 and E14 establish the limited IT and funding approvals. E16 and E18 retain the later rollout review. Contract signature, execution and results are still unestablished."}, {"id": "won", "text": "Full rollout won; record €48,000 annual savings.", "correct": false, "feedback": "E14 authorises only the pilot, and E15 describes a future target. A current cost is not an achieved saving. E18 does not establish a signed contract."}, {"id": "unfunded", "text": "No funding decision has been made.", "correct": false, "feedback": "E14 is an actual €15,000 pilot authorisation after IT approval. Preserve that progress while keeping rollout funding open."}]}, "question": {"id": "s3-question", "prompt": "Before pilot execution, which question most directly makes its proposed benefit testable?", "options": [{"id": "assume", "text": "“Can we record the target of three late shipments as this month’s result?”", "correct": false, "feedback": "E15 says the target is eight to at most three, with no reduction achieved. Treating a target as a result would remove the point of the pilot."}, {"id": "buy", "text": "“Which production package should procurement order now?”", "correct": false, "feedback": "E13 leaves production integration untested and E16 leaves rollout funding open. The bounded pilot does not support a production order."}, {"id": "measure", "text": "“Who will validate the baseline, measure late shipments and review the result before any expansion decision?”", "correct": true, "feedback": "E15 warns that one month’s baseline may vary. Named measurement and review responsibilities make the pilot useful without promising savings or rollout approval."}]}}], "legacy": {"title": "Match MEDDIC discovery questions", "elements": {"Metrics": "the measurable benefit the customer could gain", "Economic Buyer": "the person with decision authority over the funds", "Decision Criteria": "the requirements used to judge options", "Decision Process": "the steps and people involved in the buying decision", "Identify Pain": "the customer problem and its consequences", "Champion": "influential internal advocacy that helps a proposal progress"}, "prompts": [{"id": "q1", "question": "What reduction in late shipments would make the pilot worthwhile, and how would we measure it?", "key": "Metrics", "why": "The question asks for a measurable benefit and a way to test it. A pilot target is not an achieved result."}, {"id": "q2", "question": "Who can authorise the release of funds for the pilot?", "key": "Economic Buyer", "why": "The question identifies authority over funds. Knowing the approver does not establish that funding is approved."}, {"id": "q3", "question": "Which hosting and integration requirements must the service satisfy?", "key": "Decision Criteria", "why": "The question asks what the service must meet, rather than the sequence of approval steps."}, {"id": "q4", "question": "What happens after the sandbox test, and who must approve each step?", "key": "Decision Process", "why": "The question traces the route to a buying decision and the people involved."}, {"id": "q5", "question": "What is causing the late shipments, and what happens to customers and operations when they continue?", "key": "Identify Pain", "why": "The question investigates the problem, its causes and consequences. The cost figure alone does not establish solution fit."}, {"id": "q6", "question": "Who can bring colleagues and resources together to advocate for the proposed change?", "key": "Champion", "why": "The question explores internal influence and advocacy. A friendly contact or job title alone does not establish that role."}], "noteEvidence": "10 February, Niamh, Finance Controller: Finance has checked annual avoidable expediting costs at €48,000, replacing Maya’s €120,000 estimate. Recoverable savings have not been established.", "noteOptions": [{"id": "saving", "text": "Record €48,000 as the annual saving the service will deliver.", "correct": false, "feedback": "Not quite. Finance checked a current cost, not the amount this service could save. Revisit the cost-versus-saving distinction in Applying MEDDIC in a discovery call."}, {"id": "checked", "text": "Record €48,000 as Finance’s checked annual cost; keep the earlier estimate as superseded and savings as unproven.", "correct": true, "feedback": "Correct. This preserves both the correction and its limits. Revisit the Metrics evidence record in Applying MEDDIC in a discovery call."}, {"id": "average", "text": "Average the two figures to preserve both stakeholders’ contributions in the current baseline.", "correct": false, "feedback": "Not quite. The checked figure replaces the estimate; averaging them would create a new unsupported figure. Revisit the dated correction in Applying MEDDIC in a discovery call."}], "writing": {"note": "Write your evidence note, including its source, date, checked cost and remaining uncertainty.", "next": "Write one next question and explain how its answer would affect your next action.", "review": "I have reviewed my note against the supplied evidence and checked that my next question addresses an unresolved issue."}, "worked": "10 February — Niamh, Finance: checked annual avoidable expediting costs €48,000. Earlier €120,000 Maya estimate superseded. Recoverable savings unproven. Ask Operations and Finance which delay causes a pilot could affect and how a benefit would be measured before proposing savings. Other well-supported next questions are possible."}, "priorities": [{"id": "priority-first", "prompt": "At 24 February, where should the seller focus effort first?", "options": [{"id": "full", "text": "Schedule full production integration immediately.", "correct": false, "feedback": "E13 leaves production integration untested and E16 reserves the rollout review until after ERP stabilisation. Immediate production delivery would overstate the agreement."}, {"id": "pilot", "text": "Confirm the pilot charter, measurement owners and remaining agreement steps.", "correct": true, "feedback": "Pilot authorisation now gives a useful bounded next step. Confirm ownership, terms and measurement before execution. Authorisation is not proof of a signed contract."}, {"id": "prove", "text": "Publish a case study claiming the pilot has reduced delays.", "correct": false, "feedback": "E15 establishes a target, not results. There is no achieved benefit to claim."}]}, {"id": "priority-defer", "prompt": "Which work should remain for the later rollout review while the pilot is prepared?", "options": [{"id": "rollout", "text": "Full rollout funding and go-live commitment, informed by pilot and ERP evidence.", "correct": true, "feedback": "E16 sets the review for 30 September 2027, not a committed launch date. Keep the production-fit and funding gaps owned until evidence supports a decision."}, {"id": "baseline", "text": "Checking the pilot baseline and assigning a measurement owner.", "correct": false, "feedback": "E15 makes baseline reliability a live pilot issue. Deferring it would weaken the evidence the later review needs."}, {"id": "staff", "text": "Confirming the pilot staff and responsibilities.", "correct": false, "feedback": "Maya has secured staff time in E17. Clarify those responsibilities now so the authorised pilot can be prepared."}]}], "writing": {"note": "Write one CRM evidence note. Include a date, named source, evidence IDs, the supported claim and what remains open. You can keep or revise your previous note.", "next": "Choose one remaining gap. Write the question you would ask, who you would ask, a proposed owner and follow-up, and how the answer would change your next action.", "review": "I have checked my note against the dated evidence and explained how my next question could change the action. My writing is self-reviewed."}, "w
